# Local run against PostgreSQL that lives in Docker (see docker-compose.yaml).
#   task run:pg
#
# The credentials below belong to a throw-away local container reachable only from
# this machine (the port is bound to 127.0.0.1), so keeping them in git is fine.
# NEVER do this for real environments: see prod.yaml.

server:
  host: "localhost"
  port: 8997
  timeout: 10s

  cors_origins:
    - "http://localhost:5173"

database:
  driver: "postgres"
  postgres:
    host: "localhost"
    port: 5432
    user: "tenzoflow"
    password: "tenzoflow"
    name: "tenzoflow"
    sslmode: "disable"

logger:
  env: "local"
